<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator-box">
        <input type="text" class="display" placeholder="0" readonly>

        
        <div class="buttons-grid">
      
            <button class="btn btn-clear">C</button>
            <button class="btn btn-op">/</button>
            <button class="btn btn-op">*</button>
            <button class="btn btn-op">-</button>

           
            <button class="btn">7</button>
            <button class="btn">8</button>
            <button class="btn">9</button>
            <button class="btn btn-op" style="grid-row: span 2; height: 100%;">+</button> 

            
            <button class="btn">4</button>
            <button class="btn">5</button>
            <button class="btn">6</button>

            
            <button class="btn">1</button>
            <button class="btn">2</button>
            <button class="btn">3</button>
            <button class="btn btn-equal" style="grid-row: span 2; height: 100%;">=</button> 

            
            <button class="btn" style="grid-column: span 2; width: 100%;">0</button> 
            <button class="btn">.</button>
        </div>
    </div>

</body>
</html>
